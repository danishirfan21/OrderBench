id: fractional_quantity
title: Order quantities like 2.5 or 0 are silently accepted
difficulty: easy
bug_class: validator silently coerces instead of rejecting
statement: 'A partner integration reported that they ordered "2.5" units of a widget and our API happily

  answered 201. The resulting order contains exactly 2 units, and they were billed for 2. A

  different partner sent quantity 0 by mistake (a bug in their cart) and got an order for 1 unit,

  which they then had to cancel. We would much rather they got an error telling them their

  payload is wrong; domain rule O-2 says that fractional, zero and negative quantities must be

  rejected, not repaired.


  Note that we do have integrations that send whole numbers as strings ("3") or as JSON floats

  (3.0), and those must keep working.

  '
fail_to_pass:
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[float-2.5]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[str-2.5]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[float-0.4]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[int-0]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[str-0]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[int-neg]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_non_whole_or_non_positive_quantities_are_rejected[float-negzero]
- tests/held_out/fractional_quantity/test_fractional_quantity.py::test_a_bad_line_rejects_the_whole_request
pass_to_pass:
- tests/test_orders.py::test_admin_can_read_any_order
