timeout_seconds: 120
trap:
  shallow_patch: trap.patch
  description: Delete the permissive before-validator and mark the quantity field `strict=True`. That
    rejects 2.5, 0 and negative values, so every fail_to_pass test goes green.
  why_it_fails: Strict mode also rejects the numeric string "3" and the integral float 3.0, which rule
    O-2 requires the API to keep accepting. The visible-suite tests `test_numeric_quantities_are_accepted[...]`
    (pass_to_pass) fail, so the shallow fix is not resolved.
