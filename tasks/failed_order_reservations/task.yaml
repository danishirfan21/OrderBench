timeout_seconds: 120
trap:
  shallow_patch: trap.patch
  description: Roll back and re-raise, and drop the code that records the rejection in the audit log (it
    is the audit commit that appears to be 'persisting the reservations').
  why_it_fails: The stock and order rows are restored, so the new tests pass, but rule O-3 (and the ticket)
    require rejections to stay in the audit log. `test_rejected_order_is_audited` (pass_to_pass) fails.
    The correct fix keeps the audit write but performs it after the rollback.
